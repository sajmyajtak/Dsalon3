<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Jemné zrno matného papíru: šum v čokoládové barvě s krytím kolem 3 % -->
  <filter id="zrno" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.169  0 0 0 0 0.118  0 0 0 0 0.102  0 0 0 0.05 0"/>
  </filter>
  <rect width="240" height="240" filter="url(#zrno)"/>
</svg>
